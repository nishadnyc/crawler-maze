name: Pull Files from Server

on:
  workflow_dispatch:

jobs:
  fetch-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Download files from server
        run: |
          ssh "${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }}" \
            "sudo tar -czf - -C ${{ vars.SERVER_PATH }} ." \
            | tar -xzf - -C .

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Sync site files from server"
            git push origin main
          else
            echo "No changes to commit."
          fi
