name: Pull Files from Server

on:
  push:
    branches:
      - main # Triggers immediately on any new push to main
  workflow_dispatch: # Manual run button in the Actions tab
  schedule:
    - cron: '*/15 * * * *' # Runs automatically every 15 minutes

concurrency:
  group: sync-server-files
  cancel-in-progress: false

jobs:
  fetch-files:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Download files from server
        run: |
          ssh "${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }}" \
            "sudo tar -czf - -C ${{ vars.SERVER_PATH }} ." \
            | tar -xzf - -C .

      - name: Recount logs and update stats in README and Pages
        run: python3 scripts/refresh_stats.py

      - name: Commit and push changes
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@://github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Updated Logs"
            git push origin main
          else
            echo "No changes to commit."
          fi
