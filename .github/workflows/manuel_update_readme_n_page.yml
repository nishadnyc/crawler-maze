name: manuel_update_readme_n_page

# DISABLED 2026-11-22 (issue #21): the stats refresh is turned off. This
# workflow used to run scripts/refresh_stats.py manually to rewrite the
# stats panel on the GitHub Pages page (docs/index.html) and the stats
# section in README.md, but the refresh regenerates those sections from a
# fixed category list and silently overwrites manual table updates, so the
# refresh step has been removed. The workflow is kept as a no-op shell so
# it can be restored if the script is ever taught the full table again.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh disabled
        run: echo "Stats refresh is disabled (issue #21) — no files are changed by this workflow."

      - name: Commit if the numbers changed
        run: |
          if git diff --quiet docs/index.html README.md; then
            echo "Stats already up to date — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/index.html README.md
            git commit -m "Refresh page stats from logs"
            git push
          fi
