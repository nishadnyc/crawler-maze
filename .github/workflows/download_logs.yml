name: Pull Files from Server

on:
  push:
    branches:
      - main # Triggers immediately on any new push to main
  workflow_dispatch: # Manual run button in the Actions tab
  schedule:
    - cron: "*/15 * * * *" # Runs automatically every 15 minutes

concurrency:
  group: sync-server-files
  cancel-in-progress: false

env:
  OUT_FILE: README.md

jobs:
  fetch-files:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write # lets the job request a Pages rebuild after pushing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set scratch dir (outside the repo so the sync never picks it up)
        run: echo "GEO_DIR=$RUNNER_TEMP/geo" >> "$GITHUB_ENV"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Download files from server
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "sudo tar -czf - -C ${{ secrets.SERVER_PATH }} ./logs ./.maze-bans.json" \
            | tar -xzf - -C .

      # ---- Report generation (runs after logs are synced, before the commit) ----
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maxminddb
        run: pip install maxminddb

      # MaxMind limits downloads (about 30/day), so fetch the ASN DB once per day and cache it.
      # Only the .mmdb folder is cached, and only after a successful download.
      - name: Today's date (cache key)
        id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore GeoLite2-ASN cache
        id: geo
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/geo/asn
          key: geolite2-asn-v2-${{ steps.day.outputs.d }}

      - name: Download GeoLite2-ASN
        id: dl
        if: steps.geo.outputs.cache-hit != 'true'
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          mkdir -p "$GEO_DIR/asn"
          if [ -z "$MAXMIND_LICENSE_KEY" ]; then echo "No MaxMind key, using built-in table"; exit 0; fi
          curl -fsSL -u "$MAXMIND_ACCOUNT_ID:$MAXMIND_LICENSE_KEY" \
            "https://download.maxmind.com/geoip/databases/GeoLite2-ASN/download?suffix=tar.gz" \
            -o "$GEO_DIR/asn.tar.gz" || { echo "MaxMind download failed (check account ID, license key, GeoLite terms)"; exit 0; }
          tar -xzf "$GEO_DIR/asn.tar.gz" -C "$GEO_DIR"
          find "$GEO_DIR" -name 'GeoLite2-ASN.mmdb' -exec mv {} "$GEO_DIR/asn/GeoLite2-ASN.mmdb" \;
          if [ -f "$GEO_DIR/asn/GeoLite2-ASN.mmdb" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "Downloaded GeoLite2-ASN"
          else
            echo "Archive had no GeoLite2-ASN.mmdb"
          fi

      - name: Save GeoLite2-ASN cache
        if: steps.dl.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/geo/asn
          key: geolite2-asn-v2-${{ steps.day.outputs.d }}

      - name: Download vendor IP range lists
        run: |
          mkdir -p "$GEO_DIR/ranges"
          fetch() { curl -fsSL "$2" -o "$GEO_DIR/ranges/$1" || echo "skip $1"; }
          fetch gptbot.json        https://openai.com/gptbot.json
          fetch searchbot.json     https://openai.com/searchbot.json
          fetch chatgpt-user.json  https://openai.com/chatgpt-user.json
          fetch claude-bots.json   https://claude.com/crawling/bots.json

      - name: Generate report
        run: |
          python scripts/generator.py --logs logs --out "$OUT_FILE" \
            --asn-db "$GEO_DIR/asn/GeoLite2-ASN.mmdb" --ranges-dir "$GEO_DIR/ranges" \
            --html docs/index.html

      # Stats refresh DISABLED 2026-11-22 (issue #21): refresh_stats.py used to
      # run here on every sync and regenerated the README/Pages stats from a
      # fixed category list, silently overwriting manual table updates. The
      # log download/sync below is unchanged; only the refresh step is removed.

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add logs .maze-bans.json README.md docs/index.html
          if ! git diff --staged --quiet; then
            git commit -m "Updated Logs"
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit."
          fi

      # Deploy the current code from GitHub to the server. Only the site
      # code files are sent; logs/ and .maze-bans.json are server runtime
      # data and are never overwritten by a deploy.
      - name: Deploy code to server
        run: |
          tar -czf - index.php .htaccess \
            | ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
              "sudo tar --no-same-owner -xzf - -C ${{ secrets.SERVER_PATH }}"

      # Pushes made with GITHUB_TOKEN do not trigger the Pages build on their own, so ask for one.
      # Never fails the job: if Pages deploys from "GitHub Actions" instead of a branch, this just logs a note.
      - name: Request GitHub Pages rebuild
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" \
            && echo "Pages rebuild requested" \
            || echo "Pages rebuild request failed (see the job summary for the reason)"
