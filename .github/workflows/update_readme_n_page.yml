name: update_readme_n_page

# Manual refresh only: recounts the maze logs in logs/ and rewrites the
# stats panel on the GitHub Pages page (docs/index.html) AND the stats
# section in README.md from the same counts, then commits both files in
# one commit. Download_Logs.yml runs the same script automatically on
# every 15-minute log download; run this from the Actions tab only when
# you want a manual recount in between.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recount logs and rebuild the panel
        run: python3 scripts/refresh_stats.py

      - name: Commit if the numbers changed
        run: |
          if git diff --quiet docs/index.html README.md; then
            echo "Stats already up to date — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/index.html README.md
            git commit -m "Refresh page stats from logs"
            git push
          fi
