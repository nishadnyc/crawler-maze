name: Docker build & smoke test

# Builds the maze's Docker image, runs it, and pokes it the way a
# crawler would — so a green run proves the project actually works
# inside Docker, .htaccess routing included.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t crawler-maze .

      - name: Run the maze
        run: |
          docker run -d --name maze -p 8080:80 crawler-maze
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/robots.txt >/dev/null && break
            sleep 1
          done

      - name: Smoke tests
        run: |
          fail() { echo "SMOKE FAIL: $1"; exit 1; }

          # Homepage: 200, and real maze content (the trial CTA only
          # renders on a generated maze page).
          code=$(curl -s -o /tmp/home.html -w '%{http_code}' http://localhost:8080/)
          [ "$code" = "200" ] || fail "GET / returned $code, want 200"
          grep -q "Start your free trial" /tmp/home.html \
            || fail "GET / body has no maze content"

          # Deep path: 200. This is the .htaccess proof — if
          # mod_rewrite / AllowOverride were broken, Apache itself
          # would 404 this, because no such file exists on disk.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/docs/getting-started/12345)
          [ "$code" = "200" ] || fail "GET /docs/getting-started/12345 returned $code, want 200"

          # robots.txt is generated by the script: 200.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/robots.txt)
          [ "$code" = "200" ] || fail "GET /robots.txt returned $code, want 200"

          # A probe for a file that must never exist: the maze's
          # extension rule answers a plain 404.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/.env)
          [ "$code" = "404" ] || fail "GET /.env returned $code, want 404"

          # The visits above must have been logged: a dated per-subnet
          # JSON file inside the container's logs folder.
          docker exec maze sh -c 'ls /var/www/html/logs/*_20??-??-??.json >/dev/null 2>&1' \
            || fail "no dated log JSON written inside the container"

          echo "All smoke tests passed."

      - name: Container logs (on failure)
        if: failure()
        run: docker logs maze

      - name: Stop the maze
        if: always()
        run: docker rm -f maze
