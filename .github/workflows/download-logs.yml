name: Pull Files from Docker Container

on:
  workflow_dispatch:

jobs:
  fetch-files:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # Required so GITHUB_TOKEN can push back to your repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main # Ensures you are explicitly on the main branch

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Stream files from Docker container
        run: |
          mkdir -p ./public_html
          ssh "${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }}" \
            "docker cp ${{ vars.CONTAINER_NAME }}:/home/container/public_html/. -" \
            | tar -xf - -C ./public_html

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./public_html
          if ! git diff --staged --quiet; then
            git commit -m "Sync public_html from container"
            git push origin main
          else
            echo "No changes to commit."
          fi
